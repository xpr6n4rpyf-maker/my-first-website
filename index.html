<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가영이의 첫 웹사이트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="subtitle">MY FIRST WEBSITE</div>
    <h1>가영이의 첫 웹사이트</h1>
    <p class="description">함께 배우고 직접 만들어 보는 가영이의 공간입니다.</p>

    <hr>

    <section>
      <h2>내가 만드는 것</h2>

    </section>

    <hr>

    <section>
      <h2>가영이 응원하기!!!!!!</h2>
      <button id="cheerBtn">응원하기</button>

      <p class="footnote">응원 수는 현재 페이지에서만 사용하며 새로고침하면 초기화됩니다.</p>
    </section>

  <script src="script.js"></script>
